<div class="modal-header">
  <strong style="font-size:16px;">+ Create Content</strong>
  <button class="panel-close" id="modal-close-btn" style="position:static;">✕</button>
</div>
<div class="modal-body">
  <form id="quick-create-form">
    <label class="field-label">What type of content?</label>
    <div class="type-grid">
      {% for o in options %}
      <div class="type-option js-type-option" data-key="{{ o.key }}" data-platforms="{{ o.types[0].default_platform_ids if o.types else '[]' }}">
        {{ o.icon }} {{ o.label }}
      </div>
      {% endfor %}
    </div>
    <input type="hidden" name="creation_option_key" id="qc-type-key">

    <label class="field-label">What are we posting? (the actual topic — not just the type)</label>
    <input class="field-input" name="title" id="qc-title" placeholder="e.g. Does God really forgive everything?" required style="margin-bottom:14px;">

    <div class="form-grid" style="margin-bottom:14px;">
      <div>
        <label class="field-label">Publish date</label>
        <input class="field-input" type="date" name="publish_date" id="qc-date" required>
      </div>
      <div>
        <label class="field-label">Assign to</label>
        <select class="field-select" name="assigned_user_id" id="qc-assignee">
          <option value="">Unassigned</option>
          {% for u in users %}<option value="{{ u.id }}">{{ u.name }}</option>{% endfor %}
        </select>
      </div>
    </div>

    <label class="field-label">Platforms</label>
    <div id="qc-platforms" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
      {% for p in platforms %}
      <label class="checkbox-row"><input type="checkbox" name="platform_ids" value="{{ p.id }}"> {{ p.label }}</label>
      {% endfor %}
    </div>

    <details style="margin-bottom:14px;">
      <summary style="cursor:pointer; font-size:13px; color:var(--text-muted);">Advanced (optional)</summary>
      <label class="field-label" style="margin-top:10px;">Concept / notes</label>
      <textarea class="field-textarea" name="concept" id="qc-concept" placeholder="Any extra detail..."></textarea>
    </details>

    <div id="qc-error" class="flash error" style="display:none;"></div>
    <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Add to calendar</button>
  </form>
</div>

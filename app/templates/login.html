{% extends "base.html" %}
{% block title %}Sign in — TGN Content Studio{% endblock %}
{% block guest_content %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="login-brand">That's Good <span style="color:var(--accent-dark)">News</span></div>
    <div class="login-tag">Content Studio</div>
    {% if error %}<div class="flash error" style="margin-bottom:14px;">{{ error }}</div>{% endif %}
    <form method="post">
      <label class="field-label">Email</label>
      <input class="field-input" type="email" name="email" required autofocus style="margin-bottom:12px;">
      <label class="field-label">Password</label>
      <input class="field-input" type="password" name="password" required style="margin-bottom:18px;">
      <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
